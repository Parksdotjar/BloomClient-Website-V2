<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Sign in to your Bloom Client account." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self' https://accounts.google.com https://github.com; frame-ancestors 'none'" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/signin.js"></script>
    <title>Sign in — Bloom Client</title>
  </head>
  <body class="auth-body">
    <a class="skip-link" href="#main">Skip to sign in</a>
    <a class="auth-home" href="/"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Home</a>
    <main id="main" class="signin-shell">
      <section class="signin-panel" aria-labelledby="signin-title">
        <h1 id="signin-title">Sign in</h1>
        <div class="signin-providers">
          <button type="button" data-provider="google"><img src="/google-mark.svg" alt="" />Continue with Google</button>
          <button type="button" data-provider="github"><img src="/github-mark.svg" alt="" />Continue with GitHub</button>
        </div>
        <p class="signin-terms">By continuing, you agree to Bloom’s <a href="/tos/">Terms of Service</a> and <a href="/privacypolicy/">Privacy Policy</a>.</p>
      </section>
    </main>
    <div class="site-notification" data-site-notification hidden><span></span></div>
  </body>
</html>
